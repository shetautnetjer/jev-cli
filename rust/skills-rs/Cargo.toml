[package]
name = "skills-rs"
version = "0.1.0"
edition = "2021"
description = "Bounded projection and offline receipt replay for qualified Jev skill methods"
license = "MIT"
autobins = false

[[bin]]
name = "skills-rs"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
